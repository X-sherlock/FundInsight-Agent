services:
  - type: web
    name: fundinsight-agent-api
    runtime: python
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    buildCommand: pip install -e .
    startCommand: uvicorn fundinsight.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: FUNDINSIGHT_ENFORCE_REPORT_GUARD
        value: "false"
      - key: FUNDINSIGHT_CORS_ALLOW_ORIGINS
        fromService:
          name: fundinsight-agent-web
          type: web
          property: host
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: FUNDINSIGHT_LLM_PROVIDER
        value: openai

  - type: web
    name: fundinsight-agent-web
    runtime: static
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          name: fundinsight-agent-api
          type: web
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
